[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "selihorne-parallexpert_jd376"
version = "0.1.0"
description = "在同一个输入里两两比对，检测预训练并行策略专家·多机通信的带宽瓶颈相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "selihorne" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://selihorne.github.io"
Repository = "https://github.com/selihorne/parallexpert_jd376"
Issues = "https://github.com/selihorne/parallexpert_jd376/issues"

[project.scripts]
parallexpert_jd376 = "parallexpert_jd376:main"

[tool.setuptools]
py-modules = ["parallexpert_jd376"]
